[package]
name = "mdp-serve"
description = "Local HTTP server frontend (tiny_http + system browser). Enabled by the mdp-cli `serve` feature."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
mdp-core = { workspace = true }
# Synchronous, tokio-free single-page server + a reload endpoint (design
# section 3): keeps launch fast and the binary lean. `webbrowser` opens a real
# browser (not a registered editor) without blocking.
tiny_http = "0.12"
webbrowser = "1"
