[package]
name = "mdp-webview"
description = "Native webview frontend (wry + tao). Enabled by the mdp-cli `webview` feature."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
# Consumes the core's self-contained HTML product and displays it in a native
# OS webview. wry + tao are a matched pair (design section 3); wry re-exports
# `http`, so the custom-protocol Request/Response types come from `wry::http`
# with no separate http dependency.
mdp-core = { workspace = true }
wry = { workspace = true }
tao = { workspace = true }

# macOS silent PDF export (design section 4.5): reach the WKWebView wry created
# and call createPDFWithConfiguration through objc2. Proven by the Phase-7 spike.
# Windows/Linux native PDF each need their own path and are not yet implemented.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-web-kit = "0.3"
block2 = "0.6"
# Standard macOS app menu so Cmd-Q / Cmd-W close the window (a bare tao window
# has no menu to route those shortcuts to).
muda = "0.15"
# Native "Save as PDF" panel for the in-app Export button. macOS-only for now,
# matching where PDF export runs; keeps GTK/portal deps off the Linux build.
rfd = "0.15"
