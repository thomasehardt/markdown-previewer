[package]
name = "mdp-core"
description = "Markdown to self-contained HTML: parse, sanitize, asset inlining. The coverage target."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
comrak = { workspace = true }
ammonia = { workspace = true }
rust-embed = { workspace = true }
# Pure-Rust syntax highlighting (design section 3). default-features off drops
# the Oniguruma C engine; default-fancy selects the fancy-regex engine plus the
# default syntax and theme sets. Highlighting runs once in core so preview and
# export are byte-identical.
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }

[dev-dependencies]
# Review-friendly HTML snapshots; filters redact the large inlined asset blobs
# (design section 7). cargo-insta 1.48 is installed in this environment.
insta = { version = "1.48", features = ["filters"] }
